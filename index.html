<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麦禾云创 - 优质云服务与高价值资源导航</title>
    <meta name="description" content="麦禾云创 - 专注于分享优质云服务优惠、独立开发工具与 Cloudflare R2 云端直链资源。">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --primary: #3b82f6;
            --accent: #10b981;
            --danger: #ef4444;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 20px 35px -5px rgba(59, 130, 246, 0.25);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(59, 130, 246, 0.18) 0%, transparent 40%),
                radial-gradient(circle at 85% 75%, rgba(16, 185, 129, 0.12) 0%, transparent 40%),
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            z-index: -1;
            pointer-events: none;
        }

        .container { max-width: 1050px; margin: 0 auto; }

        header { text-align: center; padding: 50px 0 30px; }
        .header-badge {
            display: inline-block; padding: 4px 14px; font-size: 0.8rem;
            color: #60a5fa; background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 20px;
            margin-bottom: 12px; backdrop-filter: blur(4px);
        }
        header h1 {
            font-size: 2.5rem; color: #ffffff; margin-bottom: 10px; font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        header p { color: var(--text-sub); font-size: 1.05rem; }

        .search-box { margin: 30px auto 40px; max-width: 520px; position: relative; }
        .search-input {
            width: 100%; padding: 14px 24px; border: 1px solid var(--card-border);
            border-radius: 30px; font-size: 1rem; outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: var(--card-bg); color: var(--text-main);
            backdrop-filter: blur(12px); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.3);
            background-color: rgba(30, 41, 59, 0.9);
        }

        .section-title {
            font-size: 1.25rem; margin: 40px 0 20px; padding-left: 12px;
            border-left: 4px solid var(--primary); color: #ffffff;
            display: flex; align-items: center; gap: 8px;
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 22px; }

        .card {
            background-color: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 16px; padding: 22px; text-decoration: none; color: inherit;
            transition: all 0.3s ease; box-shadow: var(--shadow);
            display: flex; flex-direction: column; justify-content: space-between;
            backdrop-filter: blur(10px); position: relative; overflow: hidden;
        }
        .card:hover {
            transform: translateY(-5px); box-shadow: var(--shadow-hover);
            border-color: rgba(59, 130, 246, 0.5);
        }

        .card-header { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
        .card-icon {
            width: 44px; height: 44px; border-radius: 10px;
            background: rgba(59, 130, 246, 0.15); color: #60a5fa;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 1.15rem; border: 1px solid rgba(59, 130, 246, 0.2);
        }
        .card-icon.r2 { background: rgba(16, 185, 129, 0.15); color: #34d399; border-color: rgba(16, 185, 129, 0.2); }
        .card-icon.pan { background: rgba(239, 68, 68, 0.15); color: #f87171; border-color: rgba(239, 68, 68, 0.2); }

        .card-title { font-size: 1.1rem; font-weight: 600; color: #ffffff; }
        .card-desc { font-size: 0.9rem; color: var(--text-sub); line-height: 1.5; margin-bottom: 18px; }
        
        .tip-text {
            display: block; margin-top: 8px; font-size: 0.82rem;
            color: #fbbf24; background: rgba(251, 191, 36, 0.1);
            padding: 6px 10px; border-radius: 6px; border: 1px solid rgba(251, 191, 36, 0.2);
        }

        .card-footer {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.78rem; color: var(--text-sub); border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 12px;
        }
        .card-badge { padding: 3px 8px; border-radius: 6px; background: rgba(255, 255, 255, 0.06); color: #cbd5e1; font-weight: 500; }
        .card-badge.hot { background: rgba(239, 68, 68, 0.15); color: #f87171; }

        .no-result { text-align: center; padding: 40px; color: var(--text-sub); display: none; font-size: 0.95rem; }

        .contact-box {
            margin-top: 60px; background-color: var(--card-bg);
            border: 1px dashed rgba(255, 255, 255, 0.15); border-radius: 16px;
            padding: 26px; text-align: center; backdrop-filter: blur(10px);
        }
        .contact-box h3 { font-size: 1.15rem; margin-bottom: 8px; color: #ffffff; }
        .contact-box p { font-size: 0.92rem; color: var(--text-sub); }
        .contact-box a { color: #60a5fa; text-decoration: none; font-weight: 500; }

        footer { text-align: center; margin-top: 50px; padding: 24px 0; color: var(--text-sub); font-size: 0.88rem; border-top: 1px solid rgba(255, 255, 255, 0.05); }
        footer a { color: #60a5fa; text-decoration: none; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="header-badge">极速 · 免流量费 · 资源汇聚</div>
            <h1>麦禾云创</h1>
            <p>分享优质云服务、高效开发者工具与高价值资源直链</p>
        </header>

        <!-- 实时搜索框 -->
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜索资源、文件或软件..." onkeyup="filterCards()">
        </div>

        <!-- 板块 1：精选云服务优惠 -->
        <h2 class="section-title">☁️ 精选云服务优惠</h2>
        <div class="grid" id="grid-cloud"></div>

        <!-- 板块 2：R2 云存储资源 -->
        <h2 class="section-title">⚡ 麦禾云存储资源 (R2 直链)</h2>
        <div class="grid" id="grid-r2"></div>

        <!-- 板块 3：网盘大文件转存 -->
        <h2 class="section-title">📦 网盘资源与大文件</h2>
        <div class="grid" id="grid-pan"></div>

        <!-- 搜索无结果时的提示 -->
        <div id="noResult" class="no-result">没有找到相关资源，请尝试其他关键词或联系站长添加。</div>

        <!-- 反馈与联系 -->
        <div class="contact-box">
            <h3>📩 商务合作与资源反馈</h3>
            <p>如果发现失效链接，或有优质工具/云服务需要推荐，欢迎联系站长：</p>
            <p style="margin-top: 10px;"><a href="mailto:zcs334@parcel037.simplelogin.com">zcs334@parcel037.simplelogin.com</a></p>
        </div>

        <footer>
            <p>© 2026 麦禾云创 | 托管于 <a href="https://pages.cloudflare.com" target="_blank">Cloudflare Pages</a> & <a href="https://github.com" target="_blank">GitHub</a></p>
        </footer>
    </div>

    <script>
        // 页面加载后自动读取 data.json 动态渲染卡片
        document.addEventListener('DOMContentLoaded', () => {
            fetch('./data.json')
                .then(response => response.json())
                .then(data => renderCards(data))
                .catch(err => console.error('加载 data.json 失败:', err));
        });

        function renderCards(items) {
            items.forEach(item => {
                const targetGrid = document.getElementById(`grid-${item.section}`);
                if (!targetGrid) return;

                const iconClass = item.iconType ? `card-icon ${item.iconType}` : 'card-icon';
                const badgeClass = item.badgeType ? `card-badge ${item.badgeType}` : 'card-badge';
                const warningHtml = item.warning ? `<span class="tip-text">${item.warning}</span>` : '';

                const cardHtml = `
                    <a href="${item.link}" target="_blank" class="card-item card">
                        <div>
                            <div class="card-header">
                                <div class="${iconClass}">${item.icon}</div>
                                <div class="card-title">${item.title}</div>
                            </div>
                            <div class="card-desc">
                                ${item.desc}
                                ${warningHtml}
                            </div>
                        </div>
                        <div class="card-footer">
                            <span class="${badgeClass}">${item.badge}</span>
                            <span>${item.tag}</span>
                        </div>
                    </a>
                `;
                targetGrid.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        // 站内搜索功能
        function filterCards() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.getElementsByClassName('card-item');
            let visibleCount = 0;

            for (let i = 0; i < cards.length; i++) {
                const title = cards[i].querySelector('.card-title').innerText.toLowerCase();
                const desc = cards[i].querySelector('.card-desc').innerText.toLowerCase();
                
                if (title.includes(input) || desc.includes(input)) {
                    cards[i].style.display = "";
                    visibleCount++;
                } else {
                    cards[i].style.display = "none";
                }
            }

            const noResultEl = document.getElementById('noResult');
            noResultEl.style.display = (visibleCount === 0) ? "block" : "none";
        }
    </script>
</body>
</html>
