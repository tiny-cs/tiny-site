<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>麦禾云创 · 极客资源导航</title>
  <!-- FontAwesome 图标库 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --card-bg: rgba(15, 23, 42, 0.65);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --text-main: #f8fafc;
      --text-sub: #cbd5e1;
      --warning-color: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* 动态风景背景与磨砂遮罩 */
    .dynamic-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=2000&q=80') no-repeat center center/cover;
      animation: bgZoom 25s infinite alternate ease-in-out;
      z-index: -2;
    }

    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: -1;
    }

    @keyframes bgZoom {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    /* 顶部 Header */
    header {
      padding: 50px 20px 20px;
      text-align: center;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    header h1 {
      font-size: 2.4rem;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    header p {
      color: var(--text-sub);
      font-size: 0.95rem;
    }

    /* 搜索框 */
    .search-container {
      max-width: 520px;
      margin: 25px auto 0;
      position: relative;
    }

    .search-container input {
      width: 100%;
      padding: 14px 20px 14px 48px;
      background: rgba(30, 41, 59, 0.75);
      border: 1px solid var(--card-border);
      border-radius: 30px;
      color: var(--text-main);
      font-size: 0.95rem;
      backdrop-filter: blur(12px);
      outline: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .search-container input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
      background: rgba(30, 41, 59, 0.9);
    }

    .search-container i {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
      font-size: 1rem;
    }

    /* 主体内容区 */
    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 20px;
    }

    /* 分类标签导航栏 */
    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 35px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      padding: 9px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
      border-color: var(--accent);
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
    }

    /* 卡片网格 */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    /* 资源卡片 */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 22px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--accent);
      box-shadow: 0 12px 35px rgba(56, 189, 248, 0.15);
      background: rgba(30, 41, 59, 0.8);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .card-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.3;
    }

    .card-desc {
      color: var(--text-sub);
      font-size: 0.85rem;
      line-height: 1.5;
      margin-bottom: 15px;
      flex-grow: 1;
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 12px;
    }

    .card-badge {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-sub);
      padding: 3px 8px;
      border-radius: 4px;
    }

    .card-tag {
      color: var(--accent);
      font-weight: 500;
    }

    .card-warning {
      margin-top: 10px;
      font-size: 0.75rem;
      color: var(--warning-color);
      background: rgba(251, 191, 36, 0.12);
      padding: 6px 10px;
      border-radius: 6px;
      line-height: 1.4;
    }

    /* 页脚 Footer */
    footer {
      text-align: center;
      padding: 35px 20px;
      color: var(--text-sub);
      font-size: 0.85rem;
      border-top: 1px solid var(--card-border);
      margin-top: 50px;
      backdrop-filter: blur(10px);
      background: rgba(15, 23, 42, 0.5);
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    footer a:hover {
      text-decoration: underline;
    }

    /* 响应式调整 */
    @media (max-width: 640px) {
      header h1 { font-size: 1.9rem; }
      .card-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- 🌄 动态风景背景与毛玻璃遮罩层 -->
  <div class="dynamic-bg"></div>
  <div class="bg-overlay"></div>

  <!-- 🚀 顶部 Header 与 搜索框 -->
  <header>
    <h1>麦禾云创</h1>
    <p>精选极客工具 · 开源宝库 · 云端资源导航</p>
    <div class="search-container">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" placeholder="搜索资源或工具名称..." oninput="filterCards()">
    </div>
  </header>

  <!-- 📦 主体内容 -->
  <main>
    <!-- 分类标签导航栏 -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('all', this)">全部资源</button>
      <button class="tab-btn" onclick="switchTab('home', this)">精选主页</button>
      <button class="tab-btn" onclick="switchTab('cloud', this)">云端与AI</button>
      <button class="tab-btn" onclick="switchTab('r2', this)">R2 直链</button>
      <button class="tab-btn" onclick="switchTab('pan', this)">网盘资源</button>
    </div>

    <!-- 卡片渲染网格 -->
    <div class="card-grid" id="cardGrid">
      <!-- 由 JS 从 data.json 动态加载 -->
    </div>
  </main>

  <!-- 📄 网页底部 -->
  <footer>
    <p>© 2026 麦禾云创 · All Rights Reserved.</p>
    <p style="margin-top: 8px;">
      站长联系邮箱：<a href="mailto:tiny.golf878@slmails.com">tiny.golf878@slmails.com</a>
      <span style="margin: 0 8px; color: var(--card-border);">|</span>
      <a href="https://t.me/+WWxpN-Ji0jxlYmVh" target="_blank">
        <i class="fa-brands fa-telegram"></i> 官方电报群
      </a>
    </p>
  </footer>

  <!-- ⚙️ 脚本处理逻辑 -->
  <script>
    let allData = [];
    let currentCategory = 'all';

    // 页面加载时自动拉取 data.json
    async function loadData() {
      try {
        const response = await fetch('data.json');
        allData = await response.json();
        renderCards();
      } catch (error) {
        console.error('加载 data.json 失败:', error);
        document.getElementById('cardGrid').innerHTML = '<p style="color: var(--text-sub); grid-column: 1/-1; text-align: center;">资源数据加载失败，请检查网络或配置。</p>';
      }
    }

    // 渲染卡片
    function renderCards() {
      const grid = document.getElementById('cardGrid');
      const keyword = document.getElementById('searchInput').value.toLowerCase().trim();

      const filtered = allData.filter(item => {
        const matchCategory = currentCategory === 'all' || item.section === currentCategory;
        const matchKeyword = item.title.toLowerCase().includes(keyword) || 
                             item.desc.toLowerCase().includes(keyword) ||
                             (item.tag && item.tag.toLowerCase().includes(keyword));
        return matchCategory && matchKeyword;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<p style="color: var(--text-sub); grid-column: 1/-1; text-align: center; padding: 40px 0;">未找到相关资源卡片</p>';
        return;
      }

      grid.innerHTML = filtered.map(item => `
        <a href="${item.link}" target="_blank" class="card">
          <div>
            <div class="card-header">
              <div class="card-icon">${item.icon || '🔗'}</div>
              <div class="card-title">${item.title}</div>
            </div>
            <div class="card-desc">${item.desc}</div>
          </div>
          <div>
            ${item.warning ? `<div class="card-warning">${item.warning}</div>` : ''}
            <div class="card-meta">
              <span class="card-badge">${item.badge || '资源'}</span>
              <span class="card-tag">${item.tag || ''}</span>
            </div>
          </div>
        </a>
      `).join('');
    }

    // 分类切换
    function switchTab(category, btn) {
      currentCategory = category;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCards();
    }

    // 搜索过滤
    function filterCards() {
      renderCards();
    }

    // 初始化运行
    loadData();
  </script>
</body>
</html>
