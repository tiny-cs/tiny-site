<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>麦禾云创 · 资源导航</title>
  <!-- 引入现代字体与 CDN 图标库 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(99, 102, 241, 0.4);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #6366f1;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 40px 20px;
      line-height: 1.5;
    }

    /* 头部 Title 装饰 */
    header { text-align: center; margin-bottom: 30px; }
    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    header p { color: var(--text-sub); font-size: 0.95rem; }

    /* 归类 Tab 导航栏 */
    .filter-nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 35px;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.88rem;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    }

    /* 网格布局 */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    /* 卡片玻璃拟态美化 */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      backdrop-filter: blur(12px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--card-hover-border);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .card-icon {
      width: 42px; height: 42px;
      border-radius: 10px;
      background: var(--accent-gradient);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 1.1rem;
      flex-shrink: 0;
    }
    .card-title { font-size: 1.1rem; font-weight: 600; color: var(--text-main); }

    .card-desc { font-size: 0.88rem; color: var(--text-sub); margin-bottom: 15px; flex-grow: 1; }

    .card-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 15px; }
    .tag {
      font-size: 0.75rem; padding: 3px 8px; border-radius: 6px;
      background: rgba(255, 255, 255, 0.06); color: #cbd5e1;
    }
    .badge-hot { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }

    .card-link {
      display: block; text-align: center; background: rgba(255, 255, 255, 0.08);
      color: var(--text-main); text-decoration: none; padding: 9px;
      border-radius: 8px; font-size: 0.88rem; font-weight: 500;
      transition: background 0.2s;
    }
    .card-link:hover { background: var(--accent); }
    .warning-text { font-size: 0.75rem; color: #fbbf24; margin-top: 8px; line-height: 1.3; }
  </style>
</head>
<body>

  <header>
    <h1>麦禾云创 · 资源导航</h1>
    <p>高效 · 低耗 · 双通道资源管理中心</p>
  </header>

  <!-- 🎯 分类归类 Tab 导航栏 -->
  <div class="filter-nav">
    <button class="filter-btn active" onclick="filterCategory('all')">🌟 全部资源</button>
    <button class="filter-btn" onclick="filterCategory('cloud')">☁️ 云端 & AI 协同</button>
    <button class="filter-btn" onclick="filterCategory('r2')">⚡ R2 直链文件</button>
    <button class="filter-btn" onclick="filterCategory('pan')">📁 极速网盘资源</button>
  </div>

  <!-- 卡片显示区域 -->
  <div class="container" id="card-container"></div>

  <script>
    let allData = [];

    // 从 json 动态加载数据
    fetch('./data.json')
      .then(res => res.json())
      .then(data => {
        allData = data;
        renderCards('all');
      });

    // 渲染卡片函数
    function renderCards(category) {
      const container = document.getElementById('card-container');
      container.innerHTML = '';
      
      const filtered = category === 'all' 
        ? allData 
        : allData.filter(item => item.section === category);

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <div class="card-icon">${item.icon || '源'}</div>
            <div class="card-title">${item.title}</div>
          </div>
          <div class="card-desc">${item.desc}</div>
          <div class="card-tags">
            ${item.badge ? `<span class="tag badge-hot">${item.badge}</span>` : ''}
            ${item.tag ? `<span class="tag">${item.tag}</span>` : ''}
          </div>
          <a class="card-link" href="${item.link}" target="_blank">立即访问 / 获取</a>
          ${item.warning ? `<div class="warning-text">${item.warning}</div>` : ''}
        `;
        container.appendChild(card);
      });
    }

    // 分类切换点击事件
    function filterCategory(cat) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderCards(cat);
    }
  </script>
</body>
</html>
