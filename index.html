<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>麦禾云创 · 资源导航</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #0f172a;
      --nav-bg: rgba(15, 23, 42, 0.8);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(99, 102, 241, 0.4);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #6366f1;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding-top: 90px; /* 留出顶部固定导航栏空间 */
      padding-bottom: 40px;
      line-height: 1.5;
    }

    /* 📌 顶部固定导航栏 (Fixed Header) */
    .navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 70px;
      background: var(--nav-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5%;
    }

    /* Brand Logo */
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.25rem;
      font-weight: 800;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
      text-decoration: none;
    }

    /* 导航分类按钮组 */
    .nav-menu {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-item {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-sub);
      padding: 7px 14px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-item:hover, .nav-item.active {
      color: #fff;
      background: rgba(99, 102, 241, 0.15);
      border-color: rgba(99, 102, 241, 0.3);
    }

    /* 右侧动作控制区 */
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .filter-chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-chip:hover, .filter-chip.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* 主内容区 */
    .container {
      max-width: 1150px;
      margin: 0 auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 22px;
    }

    /* 卡片美化 */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 22px;
      backdrop-filter: blur(12px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--card-hover-border);
      box-shadow: 0 12px 30px -10px rgba(99, 102, 241, 0.25);
    }
    .card-header { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
    .card-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: var(--accent-gradient);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 1.1rem; flex-shrink: 0;
    }
    .card-title { font-size: 1.1rem; font-weight: 600; color: var(--text-main); }
    .card-desc { font-size: 0.88rem; color: var(--text-sub); margin-bottom: 16px; flex-grow: 1; }
    .card-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
    .tag { font-size: 0.75rem; padding: 3px 8px; border-radius: 6px; background: rgba(255, 255, 255, 0.06); color: #cbd5e1; }
    .badge-cn { background: rgba(34, 197, 94, 0.15); color: #86efac; border: 1px solid rgba(34, 197, 94, 0.3); }
    .badge-os { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
    .card-link {
      display: block; text-align: center; background: rgba(255, 255, 255, 0.08);
      color: var(--text-main); text-decoration: none; padding: 10px;
      border-radius: 10px; font-size: 0.88rem; font-weight: 500; transition: background 0.2s;
    }
    .card-link:hover { background: var(--accent); }
    .warning-text { font-size: 0.75rem; color: #fbbf24; margin-top: 8px; }

    /* 移动端适配 */
    @media (max-width: 768px) {
      .nav-menu { display: none; } /* 移动端隐藏中间文字，保持顶部干净 */
    }
  </style>
</head>
<body>

  <!-- 🌟 固定顶部导航栏 -->
  <nav class="navbar">
    <a href="#" class="nav-brand" onclick="filterData('all', 'section')">
      🌾 麦禾云创
    </a>

    <!-- 中间：核心分类导航Tab -->
    <div class="nav-menu">
      <button class="nav-item active" onclick="setActiveTab(this); filterData('all', 'section')">
        <i class="fa-solid fa-house"></i> 全部
      </button>
      <button class="nav-item" onclick="setActiveTab(this); filterData('cloud', 'section')">
        <i class="fa-solid fa-cloud"></i> 云端与AI
      </button>
      <button class="nav-item" onclick="setActiveTab(this); filterData('r2', 'section')">
        <i class="fa-solid fa-bolt"></i> R2直链
      </button>
      <button class="nav-item" onclick="setActiveTab(this); filterData('pan', 'section')">
        <i class="fa-solid fa-folder-open"></i> 极速网盘
      </button>
    </div>

    <!-- 右侧：国内外通道通道快速过滤 -->
    <div class="nav-actions">
      <button class="filter-chip" onclick="filterData('国内直连', 'badge')">🇨🇳 国内免翻</button>
      <button class="filter-chip" onclick="filterData('海外使用', 'badge')">🌍 海外代理</button>
    </div>
  </nav>

  <!-- 卡片展示容器 -->
  <div class="container" id="card-container"></div>

  <script>
    let allData = [];

    fetch('./data.json')
      .then(res => res.json())
      .then(data => {
        allData = data;
        renderCards(allData);
      });

    // 切换 Tab 选中样式
    function setActiveTab(btn) {
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      btn.classList.add('active');
    }

    // 核心过滤逻辑（按 Section 或按 Badge）
    function filterData(val, type) {
      if (val === 'all') {
        renderCards(allData);
        return;
      }
      const filtered = allData.filter(item => {
        return type === 'section' ? item.section === val : (item.badge && item.badge.includes(val));
      });
      renderCards(filtered);
    }

    // 渲染卡片 HTML
    function renderCards(dataList) {
      const container = document.getElementById('card-container');
      container.innerHTML = '';
      
      dataList.forEach(item => {
        const isCN = item.badge && item.badge.includes('国内');
        const badgeClass = isCN ? 'badge-cn' : (item.badge && item.badge.includes('海外') ? 'badge-os' : '');
        
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <div class="card-icon">${item.icon || '源'}</div>
            <div class="card-title">${item.title}</div>
          </div>
          <div class="card-desc">${item.desc}</div>
          <div class="card-tags">
            ${item.badge ? `<span class="tag ${badgeClass}">${item.badge}</span>` : ''}
            ${item.tag ? `<span class="tag">${item.tag}</span>` : ''}
          </div>
          <a class="card-link" href="${item.link}" target="_blank">立即访问 / 获取</a>
          ${item.warning ? `<div class="warning-text">${item.warning}</div>` : ''}
        `;
        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
